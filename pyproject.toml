[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orgs-app-job-auto-rustwright"
version = "1.0.0"
description = "Automated job application agent powered by Rustwright and multi-provider LLMs (Gemini, HuggingFace, Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vinayak Gawade" }
]
keywords = [
    "job-automation",
    "rustwright",
    "playwright",
    "workday",
    "ats",
    "llm",
    "gemini",
    "huggingface",
    "ollama"
]
dependencies = [
    "rustwright>=0.3.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.0",
    "google-genai>=2.33.0",
]

[project.scripts]
job-auto = "main:main"
